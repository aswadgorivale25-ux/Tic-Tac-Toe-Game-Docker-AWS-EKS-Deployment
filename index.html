<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ujwal's Tic Tac Toe</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #667eea,
          #764ba2
        );

      color: white;
    }


    /* MAIN GAME */

    .game {
      width: 430px;
      max-width: 95%;

      padding: 30px;

      text-align: center;

      background:
        rgba(255, 255, 255, 0.15);

      border-radius: 25px;

      backdrop-filter: blur(15px);

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.3);
    }


    /* TITLE */

    h1 {
      margin-top: 0;
      margin-bottom: 5px;

      font-size: 36px;
    }


    .subtitle {
      margin-top: 0;
      margin-bottom: 20px;

      font-size: 15px;

      opacity: 0.9;
    }


    /* SCORE BOARD */

    .scores {
      display: flex;

      gap: 15px;

      margin-bottom: 20px;
    }


    .score {
      flex: 1;

      padding: 15px;

      border-radius: 15px;

      background:
        rgba(255, 255, 255, 0.2);
    }


    .score h2 {
      margin: 5px 0;

      font-size: 20px;
    }


    .score-number {
      font-size: 35px;

      font-weight: bold;
    }


    .x {
      color: #ff5252;
    }


    .o {
      color: #00e5ff;
    }


    /* STATUS */

    #status {
      font-size: 20px;

      font-weight: bold;

      margin: 15px 0;
    }


    /* GAME BOARD */

    #board {

      width: 320px;
      height: 320px;

      margin: 20px auto;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      grid-template-rows:
        repeat(3, 1fr);

      gap: 8px;
    }


    /* GAME BOX */

    .cell {

      width: 100%;
      height: 100%;

      border: none;

      border-radius: 15px;

      background: white;

      font-size: 55px;

      font-weight: bold;

      cursor: pointer;

      display: flex;

      justify-content: center;

      align-items: center;

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }


    /* HOVER */

    .cell:hover {

      transform:
        scale(1.05);

      box-shadow:
        0 8px 20px
        rgba(0, 0, 0, 0.3);
    }


    /* CLICK */

    .cell:active {

      transform:
        scale(0.90);
    }


    /* X ANIMATION */

    .x-symbol {

      color: #ff3030;

      animation:
        pop 0.35s ease;
    }


    /* O ANIMATION */

    .o-symbol {

      color: #0099bb;

      animation:
        pop 0.35s ease;
    }


    /* POP ANIMATION */

    @keyframes pop {

      0% {
        transform: scale(0);
      }

      70% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1);
      }

    }


    /* WINNING BOX */

    .winner {

      background: #ffd740;

      color: #222 !important;

      animation:
        winnerAnimation
        0.5s
        infinite
        alternate;
    }


    /* WINNER ANIMATION */

    @keyframes winnerAnimation {

      from {

        transform:
          scale(1);

        box-shadow:
          0 0 5px white;
      }

      to {

        transform:
          scale(1.08);

        box-shadow:
          0 0 30px white;
      }

    }


    /* BUTTON AREA */

    .buttons {

      display: flex;

      justify-content: center;

      gap: 10px;

      margin-top: 20px;
    }


    /* BUTTON */

    button.control {

      border: none;

      padding: 12px 18px;

      border-radius: 10px;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.2s;
    }


    button.control:hover {

      transform:
        scale(1.05);
    }


    /* NEW GAME */

    .new-game {

      background: #00e5ff;

      color: #111;
    }


    /* RESET */

    .reset {

      background: #ff5252;

      color: white;
    }


    /* CREATOR */

    .creator {

      margin-top: 25px;

      font-size: 15px;

      opacity: 0.95;
    }


    .creator strong {

      color: #00e5ff;

      font-size: 17px;
    }


    /* EKS */

    .eks {

      margin-top: 5px;

      font-size: 13px;

      opacity: 0.8;
    }


    /* MOBILE */

    @media (max-width: 450px) {

      .game {

        padding: 20px;
      }


      #board {

        width: 270px;

        height: 270px;
      }


      .cell {

        font-size: 45px;
      }


      h1 {

        font-size: 30px;
      }

    }

  </style>

</head>


<body>


<div class="game">


  <!-- TITLE -->

  <h1>
    🎮 Tic Tac Toe
  </h1>


  <p class="subtitle">
    ❌ X vs ⭕ O
  </p>


  <!-- SCORE -->

  <div class="scores">


    <!-- X SCORE -->

    <div class="score">

      <h2 class="x">
        ❌ Player X
      </h2>

      <div
        id="xScore"
        class="score-number">
        0
      </div>

    </div>


    <!-- O SCORE -->

    <div class="score">

      <h2 class="o">
        ⭕ Player O
      </h2>

      <div
        id="oScore"
        class="score-number">
        0
      </div>

    </div>


  </div>


  <!-- STATUS -->

  <div id="status">
    ❌ Player X Turn
  </div>


  <!-- 9 BOX BOARD -->

  <div id="board">


    <button
      class="cell"
      data-index="0">
    </button>


    <button
      class="cell"
      data-index="1">
    </button>


    <button
      class="cell"
      data-index="2">
    </button>


    <button
      class="cell"
      data-index="3">
    </button>


    <button
      class="cell"
      data-index="4">
    </button>


    <button
      class="cell"
      data-index="5">
    </button>


    <button
      class="cell"
      data-index="6">
    </button>


    <button
      class="cell"
      data-index="7">
    </button>


    <button
      class="cell"
      data-index="8">
    </button>


  </div>


  <!-- BUTTONS -->

  <div class="buttons">


    <button
      class="control new-game"
      onclick="newGame()">

      🔄 New Game

    </button>


    <button
      class="control reset"
      onclick="resetScore()">

      🗑️ Reset Score

    </button>


  </div>


  <!-- CREATOR -->

  <p class="creator">

    👨‍💻 Created by

    <strong>
      Ujwal Khairnar
    </strong>

  </p>


  <!-- EKS -->

  <p class="eks">

    ☁️ Deployed on AWS EKS

  </p>


</div>



<script>


  /* GAME DATA */

  let board = [
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    "",
    ""
  ];


  let currentPlayer = "X";


  let gameOver = false;


  let xScore = 0;


  let oScore = 0;



  /* GET HTML ELEMENTS */

  const cells =
    document.querySelectorAll(".cell");


  const status =
    document.getElementById("status");


  const xScoreDisplay =
    document.getElementById("xScore");


  const oScoreDisplay =
    document.getElementById("oScore");



  /* WINNING PATTERNS */

  const winningPatterns = [

    [0, 1, 2],

    [3, 4, 5],

    [6, 7, 8],

    [0, 3, 6],

    [1, 4, 7],

    [2, 5, 8],

    [0, 4, 8],

    [2, 4, 6]

  ];



  /* CLICK BOX */

  cells.forEach(
    cell => {

      cell.addEventListener(
        "click",

        () => {

          const index =
            cell.dataset.index;

          playGame(index);

        }

      );

    }
  );



  /* PLAY GAME */

  function playGame(index) {


    /* DON'T ALLOW MOVE */

    if (
      board[index] !== "" ||
      gameOver
    ) {

      return;

    }



    /* PUT X OR O */

    board[index] =
      currentPlayer;



    /* DISPLAY SYMBOL */

    cells[index].textContent =
      currentPlayer === "X"
      ? "❌"
      : "⭕";



    /* ADD ANIMATION */

    if (
      currentPlayer === "X"
    ) {

      cells[index]
        .classList
        .add("x-symbol");

    }

    else {

      cells[index]
        .classList
        .add("o-symbol");

    }



    /* CHECK WINNER */

    const winner =
      checkWinner();



    if (winner) {


      gameOver = true;



      /* WINNING ANIMATION */

      winner.forEach(
        index => {

          cells[index]
            .classList
            .add("winner");

        }
      );



      /* UPDATE SCORE */

      if (
        currentPlayer === "X"
      ) {

        xScore++;

        xScoreDisplay.textContent =
          xScore;

        status.textContent =
          "🎉 ❌ Player X Wins!";

      }

      else {

        oScore++;

        oScoreDisplay.textContent =
          oScore;

        status.textContent =
          "🎉 ⭕ Player O Wins!";

      }


      return;

    }



    /* CHECK DRAW */

    if (
      !board.includes("")
    ) {

      gameOver = true;

      status.textContent =
        "🤝 Game Draw!";

      return;

    }



    /* CHANGE PLAYER */

    currentPlayer =
      currentPlayer === "X"
      ? "O"
      : "X";



    /* UPDATE STATUS */

    if (
      currentPlayer === "X"
    ) {

      status.textContent =
        "❌ Player X Turn";

    }

    else {

      status.textContent =
        "⭕ Player O Turn";

    }

  }



  /* CHECK WINNER */

  function checkWinner() {


    for (
      let pattern
      of winningPatterns
    ) {


      const [
        a,
        b,
        c
      ] = pattern;



      if (

        board[a] !== "" &&

        board[a] === board[b] &&

        board[a] === board[c]

      ) {

        return pattern;

      }

    }


    return null;

  }



  /* NEW GAME */

  function newGame() {


    board = [
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      "",
      ""
    ];


    currentPlayer = "X";


    gameOver = false;


    status.textContent =
      "❌ Player X Turn";



    cells.forEach(
      cell => {

        cell.textContent = "";

        cell.classList.remove(
          "x-symbol",
          "o-symbol",
          "winner"
        );

      }
    );

  }



  /* RESET SCORE */

  function resetScore() {


    xScore = 0;


    oScore = 0;


    xScoreDisplay.textContent =
      "0";


    oScoreDisplay.textContent =
      "0";


    newGame();

  }


</script>


</body>
</html>
